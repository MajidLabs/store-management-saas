name: Scheduled database backup

# Runs backup.sh on a schedule against whatever DATABASE_URL secret is
# configured, and uploads the dump as a workflow artifact (GitHub's default
# 90-day retention - see retention-days below to change that) as a baseline.
# For real production use, swap the upload step for pushing to S3 (this
# repo already has S3StorageProvider's env vars for that, and pg_dump's
# output is just bytes - `aws s3 cp` or the same @aws-sdk/client-s3
# used elsewhere in this repo would work equally well here) - artifacts
# are fine as a starting point, not as the only copy of a real backup.
#
# Needs a DATABASE_URL secret pointing at the actual production database -
# this workflow does nothing useful until that's configured (Settings →
# Secrets and variables → Actions → New repository secret).
#
# NOT run in this sandbox - GitHub Actions' scheduler and secrets don't
# exist here to test against. backup.sh and restore.sh, which this calls,
# were verified directly (see their own comments) - this workflow is just
# the schedule/wiring around them, unverified until it actually runs once
# a real DATABASE_URL secret exists.
on:
  schedule:
    # 03:00 UTC daily. Adjust to your actual recovery-point objective - see
    # backup.sh's comment on BACKUP_RETENTION_COUNT.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: ./scripts/backup.sh

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 30

name: Scheduled database backup

# Runs backup.sh against whatever DATABASE_URL secret is configured, and
# uploads the dump as a workflow artifact (GitHub's default 90-day
# retention - see retention-days below to change that) as a baseline.
# For real production use, swap the upload step for pushing to S3 (this
# repo already has S3StorageProvider's env vars for that, and pg_dump's
# output is just bytes - `aws s3 cp` or the same @aws-sdk/client-s3
# used elsewhere in this repo would work equally well here) - artifacts
# are fine as a starting point, not as the only copy of a real backup.
#
# STATUS (Sep 2026): the automatic daily schedule is intentionally
# disabled. This project has no live production database (deployment was
# deliberately deferred - see docs/ARCHITECTURE.md), so a scheduled run
# has nothing real to back up and would just fail every night. backup.sh
# and restore.sh themselves are verified directly against a real local
# Postgres (pg_dump/restore round-trip) - only this schedule/wiring layer
# is unverified against real GitHub Actions infrastructure.
#
# The workflow is kept, not deleted, so it can be re-enabled the moment a
# real DATABASE_URL secret exists: add the secret (Settings → Secrets and
# variables → Actions → New repository secret), then either restore the
# `schedule:` trigger below or just run it manually via workflow_dispatch
# (Actions tab → Scheduled database backup → Run workflow) any time before
# that, once the secret is set - workflow_dispatch works identically to a
# scheduled run.
#
# To re-enable the daily schedule once a real secret is set, uncomment:
# on:
#   schedule:
#     - cron: '0 3 * * *'   # 03:00 UTC daily - adjust to your actual RPO
#   workflow_dispatch: {}
on:
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: ./scripts/backup.sh

      - uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 30
